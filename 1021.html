<html>
<head>
    <style>
        table {
            border-collapse: collapse;
            text-align: center;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 12px;
            text-align: center;
            font-size: 14px;
        }
        td.timeCol th.timeCol{
            width: 20pt;
        }
        thead {
            color: #f3f0f0;
            background-color: rgb(45, 45, 45);
        }
    </style>
</head>
<body>
    <table width="400" cellpadding="10" cellspacing="10">
        <thead>
            <th class="timeCol">Time</td>
            <th>Mon</td>
            <th>Tue</td>
            <th>Wed</td>
        </thead>
        <tr>
            <td class="timeCol">abc</td>
            <td>def</td>
            <td>ghi</td>
        </tr>
        <tr>
            <td class="timeCol">qqq</td>
            <td>www</td>
            <td>eee</td>
        </tr>
    </table>
</body>
</html>
