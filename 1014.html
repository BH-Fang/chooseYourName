<html>
<head>
    <style>
        .avatar-container {
            position: relative;
            width: 100pt;
            height: 100pt;
            border-radius: 50%;
            overflow: hidden; /* 確保圖片與遮罩都不會超出圓形範圍 */
            cursor: pointer;
        }

        /* 2. 圖片設定：填滿容器 */
        .rounded_bolder {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 防止圖片變形 */
            display: block;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #3498db; /* 單一色塊顏色（可自行更改色碼） */
            color: #ffffff;            /* 文字顏色 */
            display: flex;
            justify-content: center;   /* 文字水平置中 */
            align-items: center;       /* 文字垂直置中 */
            opacity: 0;                /* 預設完全透明 */
            transition: opacity 0.3s ease; /* 加入 0.3 秒漸變動畫，效果更滑順 */
            font-family: sans-serif;
            font-size: 14pt;
        }
        .avatar-container:hover .overlay {
            opacity: 1; /* 變成完全不透明，蓋住原圖 */
        }
    </style>

    <title>rounded bolder</title>
</head>
<body>
    <div class="avatar-container">
        <img src="img/ji.jpg" alt="Avatar" class="rounded_bolder">
        <div class="overlay">hello world</div>
    </div>
</body>
</html>
